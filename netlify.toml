# Netlify serves the static marketing + legal pages (/, /privacy, /terms,
# /support) itself. Everything below is the Django backend on Railway —
# proxied (status 200) so it's reachable under getreso.app instead of the raw
# Railway URL: share/detail pages, OG + story card images, browse indexes,
# search, the waitlist endpoint, sitemaps/robots (SEO), and the well-known
# AASA/assetlinks (universal links). Order matters — specific rules first.

[[redirects]]
  from = "/c/*"
  to = "https://giglog-backend-production.up.railway.app/c/:splat"
  status = 200
  force = true

